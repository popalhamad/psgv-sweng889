services:
  ollama:
    image: ollama/ollama:latest
    container_name: sweng889-supplier-agents-ollama
    volumes:
      - ollama_data:/root/.ollama

  agent-app:
    build: .
    container_name: sweng889-supplier-agents-app
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
    volumes:
      - ./:/app
    command: python -u app.py

volumes:
  ollama_data: